<!doctype html><html lang="en"><meta charset="UTF-8"><title>Robot model workshop</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#202632;font:14px system-ui}header{padding:18px 24px;display:flex;gap:18px;align-items:center;background:white}h1{font-size:20px;margin:0}button,select{padding:8px;border:1px solid #bbb;border-radius:6px;background:white}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.card{height:290px;position:relative;border:1px solid #d5d9e0;border-radius:10px;overflow:hidden;background:#e4e6ee}.label{position:absolute;bottom:12px;left:16px;z-index:1;font-weight:600;pointer-events:none}canvas{position:fixed;inset:0;pointer-events:none}header,#grid{position:relative}header{z-index:2}.card.focus{height:650px;grid-column:1/-1}
</style><header><h1>Robot model workshop</h1><select id="season" aria-label="Season"></select><select id="pose" aria-label="Mechanism pose"><option value="idle">Stowed</option><option value="intake">Intaking</option><option value="score">Scoring / extended</option><option value="climb">Climbing</option><option value="loaded">Loaded (60%)</option><option value="full">Full hopper (100%)</option></select><button id="view">Other side</button><button id="alliance">Blue / red</button><span>Click a robot to inspect it (drag to orbit, scroll to zoom); click again to return.</span></header><div id="grid"></div><script type="module" src="./robot-gallery.ts"></script></html>
