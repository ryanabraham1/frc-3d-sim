<!doctype html><html lang="en"><meta charset="UTF-8"><title>Robot model workshop</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f4;color:#202632;font:14px system-ui}header{padding:18px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:white}h1{font-size:20px;margin:0;flex-shrink:0}header span{flex:1 1 220px;max-width:360px}button,select{flex-shrink:0;padding:8px;border:1px solid #bbb;border-radius:6px;background:white}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}.card{height:290px;position:relative;border:1px solid #d5d9e0;border-radius:10px;overflow:hidden;background:#e4e6ee}.label{position:absolute;bottom:12px;left:16px;z-index:1;font-weight:600;pointer-events:none}canvas{position:fixed;inset:0;pointer-events:none}header,#grid{position:relative}header{z-index:2}.card.focus{height:min(650px,calc(100vh - 180px));grid-column:1/-1}
</style><header><h1>Robot model workshop</h1><select id="geometry" aria-label="Model geometry"><option value="cad">Imported CAD</option><option value="procedural">Previous models</option></select><select id="season" aria-label="Season"></select><select id="pose" aria-label="Mechanism pose"><option value="cad">CAD export pose</option><option value="idle">Stowed</option><option value="intake">Intaking</option><option value="aim">Aiming shooter</option><option value="pass">Feeding / passing (2024)</option><option value="score">AMP / scoring / extended</option><option value="both">CORAL + ALGAE storage</option><option value="algae">ALGAE scoring (2025)</option><option value="endgame">Endgame · climber deployed</option><option value="climb">Climbing · grabbing</option><option value="hang">Climbing · pulled in</option><option value="loaded">Loaded (60%)</option><option value="full">Full hopper (100%)</option><option value="transfer">CORAL transfer (scrub)</option><option value="fuel-fill">FUEL intake → full hopper (hold)</option><option value="flow">Piece flow (intake → shoot loop)</option></select><select id="hood" aria-label="Shot elevation"><option value="0.5">Low shot (29°)</option><option value="0.9" selected>Mid shot (52°)</option><option value="1.25">High shot (72°)</option></select><select id="turretYaw" aria-label="Turret direction"><option value="sweep">Turret sweep</option><option value="0">Turret forward</option><option value="-1.570796">Turret left</option><option value="1.570796">Turret right</option><option value="3.141593">Turret backward</option></select><label>Transfer <input id="transfer" aria-label="Transfer progress" type="range" min="0.001" max="0.999" step="0.001" value="0.5"></label><button id="view">Other side</button><button id="alliance">Blue / red</button><span>Click a robot to inspect it (drag to orbit, scroll to zoom); click again to return.</span></header><div id="grid"></div><script type="module" src="./robot-gallery.ts"></script></html>
