# Render Blueprint — one free web service that serves the built site AND the multiplayer relay (/ws).
# Render dashboard → New → Blueprint → pick this repo. See docs/MULTIPLAYER.md §8.
services:
  - type: web
    name: frc-3d-sim
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run serve
    healthCheckPath: /healthz
    envVars:
      # server/*.ts runs via Node's built-in TypeScript type stripping (Node >= 22.18).
      - key: NODE_VERSION
        value: "24"
      # Ranked ratings (docs/RANKED.md). Set these in the Render dashboard for THIS web service only.
      # The service key has full database access: never put it on the static site or prefix it VITE_.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
